plugins {
    id 'com.android.application'
}

android {
    namespace 'com.germainz.identiconizer'
    compileSdk 36

    defaultConfig {
        applicationId "com.germainz.identiconizer"
        minSdk 26
        targetSdk 36
        versionCode 20
        versionName "2.0"
        vectorDrawables.useSupportLibrary = true
    }

    // A stable signing key lets new builds install over old ones without uninstalling.
    // CI provides it through repository secrets (see .github/workflows/build.yml);
    // without them, the release build falls back to the debug key.
    def ksFile = System.getenv("SIGNING_KEYSTORE_PATH")
    signingConfigs {
        // Checked-in debug key so every CI build has the same signature and installs as an
        // update over the previous one. It's a debug key: not secret, not for publishing.
        debug {
            storeFile file('shared-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (ksFile != null && file(ksFile).exists()) {
                storeFile file(ksFile)
                storePassword System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS")
                keyPassword System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig (ksFile != null && file(ksFile).exists())
                    ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation project(':holocolorpicker')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
}
