name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The Android SDK is preinstalled on GitHub's Ubuntu runners (ANDROID_HOME is set);
      # AGP downloads any missing platform/build-tools on first use.

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.14.3

      # Optional: use your own release key by adding these repository secrets:
      # SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD.
      # Without them the release APK is signed with the checked-in shared debug key.
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon :identiconizer:assembleRelease

      - name: Rename APK
        run: |
          mkdir -p out
          cp identiconizer/build/outputs/apk/release/*.apk "out/Identiconizer-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v6
        with:
          name: Identiconizer-apk
          path: out/*.apk
          if-no-files-found: error
